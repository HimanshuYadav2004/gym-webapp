<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gym-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d11" />

    <!-- iOS "Add to Home Screen" — Safari doesn't fully honor the web
         manifest, so standalone mode, icon, and title need these too. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GymFlow" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>GymFlow — Gym Management System</title>
    <style>
      /* Instant-paint splash — shown before React even loads, removed once it mounts */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c0d11;
        z-index: 9999;
      }
      #boot-splash svg { animation: boot-pulse 1.1s ease-in-out infinite; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(0.92); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <svg width="56" height="56" viewBox="0 0 512 512" fill="none">
          <g stroke="#ef4444" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
            <path d="M112 208v96M164 160v192M348 160v192M400 208v96M164 256h184"/>
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
